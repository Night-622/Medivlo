<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Hollow Crown</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0b08; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        color: #b9a57c; font: 18px/1.4 monospace; text-align: center; padding: 16px; box-sizing: border-box;
      }
      #boot b { color: #d4a646; font-size: 32px; letter-spacing: 4px; }
      #boot .err { color: #e88a7e; max-width: 640px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Visible until the game starts; startup errors are shown here instead of a black screen. -->
    <div id="boot"><b>THE HOLLOW CROWN</b><span id="boot-msg">Loading…</span></div>
    <script>
      (function () {
        var msg = document.getElementById('boot-msg');
        function fail(text) { if (!msg) return; msg.className = 'err'; msg.textContent = 'The game could not start: ' + text + ' (try a hard refresh: Cmd+Shift+R).'; }
        window.addEventListener('error', function (e) { if (document.getElementById('boot')) fail(e.message || 'a file failed to load'); }, true);
        window.addEventListener('unhandledrejection', function (e) { if (document.getElementById('boot')) fail(String(e.reason)); });
        var c = document.createElement('canvas');
        if (!(c.getContext('webgl') || c.getContext('2d'))) fail('this browser has no canvas/WebGL support');
      })();
    </script>
    <!-- Claude Design art libraries (same-origin, bundled): draw every sprite in code, expose window.MV -->
    <script src="/art/mv/art.js"></script>
    <script src="/art/mv/tiles.js"></script>
    <script src="/art/mv/gear.js"></script>
    <script src="/art/mv/bestiary.js"></script>
    <script src="/art/mv/map.js"></script>
    <script src="/art/mv/realms.js"></script>
    <script src="/art/mv/legendary.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
